[project]
name = "lib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pandas>=2.3.1",
    "prefect>=3.2.10",
    "prefect-cloud>=0.1.6",
    "replicate>=1.0.7",
    "ruff>=0.12.3",
    "runpod>=1.7.12",
]

[dependency-groups]
dev = ["ruff>=0.9.9", "types-requests>=2.32.4.20250809"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
