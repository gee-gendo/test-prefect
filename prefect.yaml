# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: prefect-playground
prefect-version: 3.4.8

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
  - prefect.deployments.steps.run_shell_script:
      id: get-github-token
      script: uv tool run prefect-cloud github token gee-gendo/test-prefect-deployment

  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: "https://x-access-token:{{ get-github-token.stdout }}@github.com/gee-gendo/test-prefect-deployment.git"
      branch: v3.6.0

  - prefect.deployments.steps.pip_install_requirements:
      directory: "{{ clone-step.directory }}" # `clone-step` is a user-provided `id` field
      requirements_file: requirements.txt  # the requirements.txt just points to the pyproject.toml

  # - prefect.deployments.steps.run_shell_script:
  #     directory: "{{ clone-step.directory }}" # `clone-step` is a user-provided `id` field
  #     script: pip install .

# the deployments section allows you to provide configuration for deploying flows
deployments:
  - name: crowd-production
    description: "Crowd flow production"
    tags:
      - production
    entrypoint: flows/crowd.py:crowd
    schedules: null
    work_pool:
      name: default-work-pool
  - name: crowd-staging
    description: "Crowd flow staging"
    tags:
      - staging
      - non-production
    entrypoint: flows/crowd.py:crowd
    schedules: null
    work_pool:
      name: default-work-pool
  - name: render
    entrypoint: flows/render.py:render
    schedules: null
    work_pool:
      name: default-work-pool
